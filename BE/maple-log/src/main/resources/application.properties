spring.application.name=maple-log

# Server
server.port=8081

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/maple_log?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=664wpgur@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Hibernate 6이 @Enumerated(STRING)을 MySQL ENUM 타입으로 만드는 것을 막음 → VARCHAR 사용
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Nexon Open API
nexon.api.key=test_d0e24b9578324aebefc220891cf6cefc6f815ad43f6c860f0c0964ba8a136361efe8d04e6d233bd35cf2fabdeb93fb0d
nexon.api.base-url=https://open.api.nexon.com

# JWT
jwt.secret=maplelog-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.access-expiration=3600000
jwt.refresh-expiration=604800000

# Nexon OAuth (넥슨 개발자 포털에서 발급)
nexon.oauth.client-id=YOUR_CLIENT_ID
nexon.oauth.client-secret=YOUR_CLIENT_SECRET
nexon.oauth.redirect-uri=http://localhost:8081/api/auth/oauth/nexon/callback
nexon.oauth.authorization-uri=https://openapi.nexon.com/auth/login
nexon.oauth.token-uri=https://openapi.nexon.com/auth/token
nexon.oauth.user-info-uri=https://openapi.nexon.com/auth/user-info