spring.application.name=maple-log

# 로컬 개발 시 application-local.properties 에서 환경변수 로드 (파일 없으면 무시)
spring.config.import=optional:classpath:application-local.properties

# Server (Railway는 PORT 환경변수를 자동 주입)
server.port=${PORT:8081}

# MySQL DataSource (Railway MySQL 플러그인 환경변수 사용)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:maple_log}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

# Redis (Railway Redis 플러그인 환경변수 사용)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Nexon Open API
nexon.api.key=${NEXON_API_KEY}
nexon.api.base-url=https://open.api.nexon.com

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration=3600000
jwt.refresh-expiration=604800000

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Nexon OAuth
nexon.oauth.client-id=${NEXON_OAUTH_CLIENT_ID:YOUR_CLIENT_ID}
nexon.oauth.client-secret=${NEXON_OAUTH_CLIENT_SECRET:YOUR_CLIENT_SECRET}
nexon.oauth.redirect-uri=${NEXON_OAUTH_REDIRECT_URI:http://localhost:8081/api/auth/oauth/nexon/callback}
nexon.oauth.authorization-uri=https://openapi.nexon.com/auth/login
nexon.oauth.token-uri=https://openapi.nexon.com/auth/token
nexon.oauth.user-info-uri=https://openapi.nexon.com/auth/user-info